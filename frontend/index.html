<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10263B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Truvanta" />
    <title>Truvanta — Business Operating System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div style="height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#FBF9F5;">
        <div style="position:relative;width:76px;height:76px;display:flex;align-items:center;justify-content:center;">
          <svg viewBox="0 0 32 32" width="56" height="56" style="border-radius:16px;">
            <rect width="32" height="32" rx="7" fill="#10263B"/>
            <path d="M9 20.5 L14 11 L18 17 L23 9" stroke="#E3A635" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div style="position:absolute;inset:0;border-radius:50%;border:3px solid rgba(11,27,43,0.1);border-top-color:#E3A635;animation:tv-spin 0.85s linear infinite;"></div>
        </div>
        <p style="font-family:system-ui,sans-serif;font-size:13.5px;color:#0B1B2B;opacity:0.6;margin:0;">Loading…</p>
      </div>
    </div>
    <style>@keyframes tv-spin { to { transform: rotate(360deg); } }</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
