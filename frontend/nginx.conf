server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router — any path that isn't a real file falls back to
    # index.html so client-side routing (e.g. refreshing /billing)
    # works instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxied so the browser only ever talks to one origin (this
    # nginx), avoiding CORS entirely in production.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://backend:8000/media/;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
    }
}
